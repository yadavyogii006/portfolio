<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Yogesh Yadav | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #2a2a2a;
    --text: #f0ede8;
    --muted: #888;
    --accent: #c8f04a;
    --accent2: #4af0c8;
    --accent3: #f04a8a;
    --card-bg: #141414;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.5;
  }

  .wrapper {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 2rem;
  }

  /* ——— HEADER ——— */
  header {
    padding: 3rem 0 2rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 3rem;
    position: relative;
    overflow: hidden;
  }

  header::after {
    content: 'AI';
    position: absolute;
    right: -20px;
    top: -30px;
    font-size: 220px;
    font-weight: 800;
    color: var(--surface2);
    line-height: 1;
    pointer-events: none;
    user-select: none;
    letter-spacing: -0.05em;
  }

  .header-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 10px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 1rem;
    animation: fadeSlideUp 0.6s ease both;
  }

  h1 {
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.03em;
    animation: fadeSlideUp 0.6s 0.1s ease both;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    margin-top: 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    color: var(--muted);
    max-width: 580px;
    line-height: 1.7;
    animation: fadeSlideUp 0.6s 0.2s ease both;
  }

  /* ——— LAYOUT ——— */
  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    align-items: start;
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ——— SECTION TITLES ——— */
  .section-title {
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .section-title::before {
    content: '';
    display: inline-block;
    width: 28px;
    height: 1px;
    background: var(--accent);
  }

  /* ——— EXPERIENCE ——— */
  .exp-card {
    position: relative;
    padding: 1.4rem 1.4rem 1.4rem 1.8rem;
    margin-bottom: 1.2rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: border-color 0.25s, transform 0.25s;
    animation: fadeSlideUp 0.5s ease both;
  }

  .exp-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--accent);
    border-radius: 3px 0 0 3px;
    transition: background 0.25s;
  }

  .exp-card:hover {
    border-color: #3a3a3a;
    transform: translateX(4px);
  }

  .exp-card:nth-child(2)::before { background: var(--accent2); }
  .exp-card:nth-child(3)::before { background: var(--accent3); }

  .exp-role {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }

  .exp-company {
    font-size: 0.8rem;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    margin-bottom: 6px;
  }

  .exp-card:nth-child(2) .exp-company { color: var(--accent2); }
  .exp-card:nth-child(3) .exp-company { color: var(--accent3); }

  .exp-meta {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-bottom: 10px;
  }

  .exp-points {
    list-style: none;
    padding: 0;
  }

  .exp-points li {
    font-size: 0.8rem;
    color: #aaa;
    line-height: 1.6;
    padding-left: 1rem;
    position: relative;
    margin-bottom: 4px;
  }

  .exp-points li::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--border);
    font-size: 0.75rem;
  }

  /* ——— PROJECTS ——— */
  .projects-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.2rem;
  }

  .project-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.2rem;
    transition: border-color 0.25s, box-shadow 0.25s;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    animation: fadeSlideUp 0.5s ease both;
  }

  .project-card:hover {
    border-color: #333;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .project-title {
    font-size: 0.85rem;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -0.01em;
  }

  .project-desc {
    font-size: 0.72rem;
    color: #888;
    line-height: 1.65;
    flex: 1;
  }

  .project-tech {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .tech-tag {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .video-wrap {
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 16/9;
    position: relative;
    cursor: pointer;
  }

  .video-thumb {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .video-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.2s, transform 0.3s;
  }

  .video-wrap:hover .video-thumb img {
    opacity: 0.75;
    transform: scale(1.03);
  }

  .video-play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .video-play svg {
    width: 52px;
    height: 52px;
    filter: drop-shadow(0 2px 12px rgba(0,0,0,0.8));
    transition: transform 0.2s;
  }

  .video-wrap:hover .video-play svg {
    transform: scale(1.15);
  }

  .video-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .project-btns {
    display: flex;
    gap: 6px;
  }

  .btn {
    flex: 1;
    text-align: center;
    padding: 7px 6px;
    border-radius: 8px;
    font-size: 0.68rem;
    font-family: 'DM Mono', monospace;
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: all 0.2s;
  }

  .btn-dark {
    background: var(--text);
    color: var(--bg);
    font-weight: 600;
  }

  .btn-dark:hover { background: var(--accent); color: #000; }

  .btn-outline {
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .btn-outline:hover { border-color: var(--text); color: var(--text); }

  /* ——— MODAL ——— */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
    animation: fadeIn 0.2s ease;
  }

  .modal-overlay.active {
    display: flex;
  }

  .modal-box {
    position: relative;
    width: min(860px, 92vw);
    aspect-ratio: 16/9;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.8);
    animation: scaleIn 0.25s ease;
  }

  .modal-box iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .modal-close {
    position: absolute;
    top: -40px;
    right: 0;
    background: none;
    border: none;
    color: #fff;
    font-size: 1.8rem;
    cursor: pointer;
    line-height: 1;
    opacity: 0.7;
    transition: opacity 0.2s;
    font-family: 'Syne', sans-serif;
  }

  .modal-close:hover { opacity: 1; }

  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }

  @keyframes scaleIn {
    from { transform: scale(0.92); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .exp-card:nth-child(1) { animation-delay: 0.1s; }
  .exp-card:nth-child(2) { animation-delay: 0.2s; }
  .exp-card:nth-child(3) { animation-delay: 0.3s; }

  .project-card:nth-child(1) { animation-delay: 0.15s; }
  .project-card:nth-child(2) { animation-delay: 0.25s; }
  .project-card:nth-child(3) { animation-delay: 0.35s; }
  .project-card:nth-child(4) { animation-delay: 0.45s; }
</style>
</head>
<body>
<div class="wrapper">

  <!-- HEADER -->
  <header>
    <div class="header-tag">Available for work</div>
    <h1>Yogesh<br/><span>Yadav</span></h1>
    <p class="subtitle">Generative AI / Backend Engineer — building AI-native backend systems, LLM-powered platforms, and semantic data pipelines.</p>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="layout">

    <!-- LEFT: EXPERIENCE -->
    <div>
      <p class="section-title">Experience</p>
      <div id="experience-list"></div>
    </div>

    <!-- RIGHT: PROJECTS -->
    <div>
      <p class="section-title">Projects</p>
      <div id="projects-grid" class="projects-grid"></div>
    </div>

  </div>

  <footer style="border-top: 1px solid var(--border); margin-top: 4rem; padding: 2rem 0; text-align: center;">
    <p style="font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted);">
      © 2025 Yogesh Yadav · Generative AI / Backend Engineer
    </p>
  </footer>

</div>
<script>
  const PLAY_ICON = '<svg viewBox="0 0 68 48" xmlns="http://www.w3.org/2000/svg"><rect width="68" height="48" rx="10" fill="rgba(0,0,0,0.72)"/><polygon points="26,14 26,34 46,24" fill="#fff"/></svg>';

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function extractYouTubeId(url) {
    if (!url) return null;
    const match = url.match(/(?:embed\/|v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return match ? match[1] : null;
  }

  function playVideo(el, videoId) {
    el.innerHTML = '<iframe src="https://www.youtube.com/embed/' + videoId + '?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
    el.style.cursor = 'default';
    el.onclick = null;
  }

  function renderExperience(experiences) {
    const container = document.getElementById('experience-list');
    container.innerHTML = experiences.map((exp, i) => `
      <div class="exp-card" style="animation-delay: ${0.1 + i * 0.1}s">
        <div class="exp-role">${escapeHtml(exp.role)}</div>
        <div class="exp-company">${escapeHtml(exp.company)}</div>
        <div class="exp-meta">${escapeHtml(exp.duration)} · ${escapeHtml(exp.location)}</div>
        <ul class="exp-points">
          ${exp.points.map(point => `<li>${escapeHtml(point)}</li>`).join('')}
        </ul>
      </div>
    `).join('');
  }

  function renderVideoSection(project) {
    const videoId = extractYouTubeId(project.demoVideo);
    if (!videoId) {
      return `<div class="video-wrap" style="background:#1a1a1a; display:flex; align-items:center; justify-content:center; cursor:default;">
        <div style="text-align:center; color:#555; font-family:'DM Mono',monospace; font-size:0.7rem;">No demo video</div>
      </div>`;
    }
    return `<div class="video-wrap" onclick="playVideo(this, '${videoId}')">
      <div class="video-thumb"><img src="https://img.youtube.com/vi/${videoId}/mqdefault.jpg" alt="${escapeHtml(project.title)} Demo"/></div>
      <div class="video-play">${PLAY_ICON}</div>
    </div>`;
  }

  function renderProjects(projects) {
    const container = document.getElementById('projects-grid');
    container.innerHTML = projects.map((project, i) => `
      <div class="project-card" style="animation-delay: ${0.15 + i * 0.1}s">
        <div class="project-title">${escapeHtml(project.title)}</div>
        <p class="project-desc">${escapeHtml(project.description)}</p>
        <div class="project-tech">
          ${project.tech.map(t => `<span class="tech-tag">${escapeHtml(t)}</span>`).join('')}
        </div>
        ${renderVideoSection(project)}
        <div class="project-btns">
          <a class="btn btn-dark" href="${escapeHtml(project.liveUrl)}" target="_blank" rel="noopener noreferrer">🚀 Live</a>
          <a class="btn btn-outline" href="${escapeHtml(project.githubUrl)}" target="_blank" rel="noopener noreferrer">💻 GitHub</a>
        </div>
      </div>
    `).join('');
  }

  async function loadPortfolio() {
    try {
      const [experiences, projects] = await Promise.all([
        fetch('data/experience.json').then(r => r.json()),
        fetch('data/projects.json').then(r => r.json())
      ]);
      renderExperience(experiences);
      renderProjects(projects);
    } catch (err) {
      console.error('Failed to load portfolio data:', err);
      document.getElementById('experience-list').innerHTML =
        '<p style="color:#888;font-size:0.8rem;">Could not load experience data. Serve this site over HTTP (e.g. <code>python -m http.server</code>).</p>';
      document.getElementById('projects-grid').innerHTML =
        '<p style="color:#888;font-size:0.8rem;">Could not load projects data.</p>';
    }
  }

  loadPortfolio();
</script>
</body>
</html>
