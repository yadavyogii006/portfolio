<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #f4f7fb;
    --bg-soft: #eef2ff;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --accent-2: #0ea5e9;
    --accent-3: #ec4899;
    --success: #10b981;
    --shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
    --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.06);
    --radius: 16px;
    --max: 1120px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(circle at top left, rgba(79, 70, 229, 0.12), transparent 28%),
      radial-gradient(circle at top right, rgba(14, 165, 233, 0.10), transparent 24%),
      linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  a { color: inherit; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(14px);
    background: rgba(255, 255, 255, 0.82);
    border-bottom: 1px solid rgba(226, 232, 240, 0.9);
  }

  .topbar-inner,
  .container {
    max-width: var(--max);
    margin: 0 auto;
    padding: 0 1.25rem;
  }

  .topbar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 64px;
    gap: 1rem;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-weight: 800;
    letter-spacing: -0.03em;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    color: white;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    font-size: 0.85rem;
    box-shadow: var(--shadow-sm);
  }

  .nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 1rem;
  }

  .nav a {
    text-decoration: none;
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 500;
    transition: color 0.2s;
  }

  .nav a:hover { color: var(--accent); }

  .hero {
    padding: 3rem 0 2rem;
  }

  .hero-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) + 4px);
    box-shadow: var(--shadow);
    padding: 2rem;
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 2rem;
    position: relative;
    overflow: hidden;
  }

  .hero-card::after {
    content: '';
    position: absolute;
    inset: auto -80px -80px auto;
    width: 220px;
    height: 220px;
    background: radial-gradient(circle, rgba(79, 70, 229, 0.12), transparent 70%);
    pointer-events: none;
  }

  @media (max-width: 900px) {
    .hero-card { grid-template-columns: 1fr; }
    .nav { display: none; }
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.35rem 0.75rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.78rem;
    font-weight: 600;
    margin-bottom: 1rem;
  }

  .eyebrow-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3.4rem);
    line-height: 1.05;
    letter-spacing: -0.04em;
    margin-bottom: 0.75rem;
  }

  h1 span {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .lead {
    color: var(--muted);
    font-size: 1rem;
    max-width: 58ch;
    margin-bottom: 1.25rem;
  }

  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.75rem 1rem;
    border-radius: 12px;
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 600;
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #6366f1);
    color: white;
    box-shadow: 0 10px 24px rgba(79, 70, 229, 0.25);
  }

  .btn-primary:hover { transform: translateY(-1px); }

  .btn-secondary {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
  }

  .stat {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0.9rem 1rem;
  }

  .stat strong {
    display: block;
    font-size: 1.35rem;
    letter-spacing: -0.03em;
  }

  .stat span {
    color: var(--muted);
    font-size: 0.78rem;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 1.25rem;
  }

  .panel h3,
  .section-head h2 {
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 0.85rem;
  }

  .contact-list {
    display: grid;
    gap: 0.55rem;
  }

  .contact-list a {
    text-decoration: none;
    color: var(--text);
    font-size: 0.92rem;
    padding: 0.65rem 0.75rem;
    border-radius: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    transition: border-color 0.2s, transform 0.2s;
  }

  .contact-list a:hover {
    border-color: #c7d2fe;
    transform: translateX(2px);
  }

  .education-line {
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.7;
  }

  .education-line strong { color: var(--text); }

  .section {
    padding: 1rem 0 2.5rem;
  }

  .section-head {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }

  .section-head h2 {
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    letter-spacing: -0.03em;
    text-transform: none;
    color: var(--text);
    margin: 0;
  }

  .section-head p {
    color: var(--muted);
    font-size: 0.92rem;
    max-width: 36ch;
    text-align: right;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
  }

  @media (max-width: 900px) {
    .grid-2 { grid-template-columns: 1fr; }
    .section-head { flex-direction: column; align-items: start; }
    .section-head p { text-align: left; }
  }

  .timeline {
    display: grid;
    gap: 1rem;
  }

  .exp-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 1.25rem 1.25rem 1.25rem 1.4rem;
    position: relative;
  }

  .exp-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 1rem;
    bottom: 1rem;
    width: 4px;
    border-radius: 4px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
  }

  .exp-card:nth-child(2)::before {
    background: linear-gradient(180deg, var(--accent-2), var(--success));
  }

  .exp-card:nth-child(3)::before {
    background: linear-gradient(180deg, var(--accent-3), #f97316);
  }

  .exp-role {
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 0.15rem;
  }

  .exp-company {
    color: var(--accent);
    font-weight: 600;
    font-size: 0.92rem;
    margin-bottom: 0.35rem;
  }

  .exp-meta {
    color: var(--muted);
    font-size: 0.82rem;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 0.75rem;
  }

  .exp-points {
    list-style: none;
    display: grid;
    gap: 0.45rem;
  }

  .exp-points li {
    color: #334155;
    font-size: 0.92rem;
    padding-left: 1rem;
    position: relative;
  }

  .exp-points li::before {
    content: '•';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: 700;
  }

  .skills-wrap {
    display: grid;
    gap: 1rem;
  }

  .skill-group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    box-shadow: var(--shadow-sm);
  }

  .skill-category {
    font-size: 0.78rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 0.65rem;
  }

  .skills-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
  }

  .skill-tag,
  .tech-tag {
    font-size: 0.78rem;
    padding: 0.35rem 0.65rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: #3730a3;
    border: 1px solid #dbeafe;
    font-weight: 500;
  }

  .projects-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem;
  }

  @media (max-width: 760px) {
    .projects-grid { grid-template-columns: 1fr; }
  }

  .project-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .project-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow);
  }

  .project-title {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .project-desc {
    color: var(--muted);
    font-size: 0.88rem;
    flex: 1;
  }

  .project-tech {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }

  .tech-tag {
    background: #f1f5f9;
    color: #475569;
    border-color: #e2e8f0;
  }

  .video-wrap {
    border-radius: 12px;
    overflow: hidden;
    background: #0f172a;
    aspect-ratio: 16/9;
    position: relative;
    cursor: pointer;
  }

  .video-thumb,
  .video-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .video-thumb {
    position: absolute;
    inset: 0;
  }

  .video-play {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
  }

  .video-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .video-placeholder {
    display: grid;
    place-items: center;
    color: #94a3b8;
    font-size: 0.82rem;
    font-family: 'JetBrains Mono', monospace;
  }

  .project-btns {
    display: flex;
    gap: 0.5rem;
  }

  .project-btns .btn {
    flex: 1;
    padding: 0.65rem 0.75rem;
    font-size: 0.82rem;
  }

  .site-footer {
    border-top: 1px solid var(--border);
    padding: 1.5rem 0 2.5rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .loading-screen {
    min-height: 70vh;
    display: grid;
    place-items: center;
    padding: 2rem;
  }

  .loading-card {
    width: min(520px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 2rem;
    text-align: center;
  }

  .spinner {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 3px solid #e2e8f0;
    border-top-color: var(--accent);
    margin: 0 auto 1rem;
    animation: spin 0.8s linear infinite;
  }

  .load-error {
    color: #b91c1c;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 12px;
    padding: 1rem;
    font-size: 0.92rem;
    line-height: 1.6;
  }

  .load-error code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-up { animation: fadeUp 0.45s ease both; }
</style>
</head>
<body>
  <div id="app">
    <div class="loading-screen">
      <div class="loading-card">
        <div class="spinner"></div>
        <p>Loading portfolio…</p>
      </div>
    </div>
  </div>

<script>
  const PLAY_ICON = '<svg width="56" height="56" viewBox="0 0 68 48" xmlns="http://www.w3.org/2000/svg"><rect width="68" height="48" rx="10" fill="rgba(255,255,255,0.92)"/><polygon points="26,14 26,34 46,24" fill="#4f46e5"/></svg>';
  let uiLabels = {};

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function extractYouTubeId(url) {
    if (!url) return null;
    const match = url.match(/(?:embed\/|v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return match ? match[1] : null;
  }

  function playVideo(el, videoId) {
    el.innerHTML = '<iframe src="https://www.youtube.com/embed/' + videoId + '?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
    el.style.cursor = 'default';
    el.onclick = null;
  }

  async function fetchJson(path) {
    const res = await fetch(path);
    if (!res.ok) throw new Error('Failed to load ' + path);
    return res.json();
  }

  async function loadData() {
    try {
      const [profile, experience, projects, skills] = await Promise.all([
        fetchJson('data/profile.json'),
        fetchJson('data/experience.json'),
        fetchJson('data/projects.json'),
        fetchJson('data/skills.json')
      ]);
      return { profile, experience, projects, skills };
    } catch (err) {
      console.warn('Using embedded portfolio fallback:', err);
      return JSON.parse(document.getElementById('portfolio-fallback').textContent);
    }
  }

  function renderPage({ profile, experience, projects, skills }) {
    document.title = profile.pageTitle;
    uiLabels = profile.labels;
    const initials = (profile.name.first[0] + profile.name.last[0]).toUpperCase();
    const yearsExp = Math.max(1, experience.length);
    const primary = profile.contact.find(c => c.url.startsWith('mailto:')) || profile.contact[0];
    const github = profile.contact.find(c => /github/i.test(c.label));

    document.getElementById('app').innerHTML = `
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <div class="brand-mark">${escapeHtml(initials)}</div>
            <span>${escapeHtml(profile.name.first)} ${escapeHtml(profile.name.last)}</span>
          </div>
          <nav class="nav">
            <a href="#about">About</a>
            <a href="#experience">Experience</a>
            <a href="#projects">Projects</a>
            <a href="#skills">Skills</a>
            <a href="#contact">Contact</a>
          </nav>
        </div>
      </header>

      <main class="container">
        <section class="hero fade-up" id="about">
          <div class="hero-card">
            <div>
              <div class="eyebrow"><span class="eyebrow-dot"></span>${escapeHtml(profile.tag)}</div>
              <h1>${escapeHtml(profile.name.first)} <span>${escapeHtml(profile.name.last)}</span></h1>
              <p class="lead">${escapeHtml(profile.about)}</p>
              <div class="hero-actions">
                <a class="btn btn-primary" href="${escapeHtml(primary.url)}">Contact Me</a>
                ${github ? `<a class="btn btn-secondary" href="${escapeHtml(github.url)}" target="_blank" rel="noopener noreferrer">View GitHub</a>` : ''}
              </div>
              <div class="stats">
                <div class="stat"><strong>${yearsExp}+</strong><span>Roles shipped</span></div>
                <div class="stat"><strong>${projects.length}</strong><span>Featured projects</span></div>
                <div class="stat"><strong>${skills.reduce((n, g) => n + g.skills.length, 0)}</strong><span>Skills listed</span></div>
              </div>
            </div>
            <div>
              <div class="panel" style="margin-bottom:1rem;">
                <h3>${escapeHtml(profile.sections.education)}</h3>
                <p class="education-line">
                  <strong>${escapeHtml(profile.education.institution)}</strong><br/>
                  ${escapeHtml(profile.education.degree)}<br/>
                  ${escapeHtml(profile.education.duration)} · CGPA ${escapeHtml(profile.education.cgpa)}
                </p>
              </div>
              <div class="panel" id="contact">
                <h3>Contact</h3>
                <div class="contact-list">
                  ${profile.contact.map(link => {
                    const external = link.url.startsWith('http');
                    return `<a href="${escapeHtml(link.url)}"${external ? ' target="_blank" rel="noopener noreferrer"' : ''}>${escapeHtml(link.label)}</a>`;
                  }).join('')}
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="section fade-up" id="experience">
          <div class="section-head">
            <h2>${escapeHtml(profile.sections.experience)}</h2>
            <p>Production AI systems, backend services, and measurable impact across internships and full-time roles.</p>
          </div>
          <div class="timeline" id="experience-list"></div>
        </section>

        <section class="section fade-up" id="projects">
          <div class="section-head">
            <h2>${escapeHtml(profile.sections.projects)}</h2>
            <p>Selected builds with live demos, GitHub repos, and walkthrough videos.</p>
          </div>
          <div id="projects-grid" class="projects-grid"></div>
        </section>

        <section class="section fade-up" id="skills">
          <div class="section-head">
            <h2>${escapeHtml(profile.sections.skills)}</h2>
            <p>Tools and domains I use to ship AI-native backend products.</p>
          </div>
          <div class="skills-wrap" id="skills-list"></div>
        </section>
      </main>

      <footer class="site-footer container" id="site-footer"></footer>
    `;

    document.getElementById('experience-list').innerHTML = experience.map(exp => `
      <article class="exp-card">
        <div class="exp-role">${escapeHtml(exp.role)}</div>
        <div class="exp-company">${escapeHtml(exp.company)}</div>
        <div class="exp-meta">${escapeHtml(exp.duration)} · ${escapeHtml(exp.location)}</div>
        <ul class="exp-points">
          ${exp.points.map(point => `<li>${escapeHtml(point)}</li>`).join('')}
        </ul>
      </article>
    `).join('');

    document.getElementById('projects-grid').innerHTML = projects.map(project => `
      <article class="project-card">
        <div class="project-title">${escapeHtml(project.title)}</div>
        <p class="project-desc">${escapeHtml(project.description)}</p>
        <div class="project-tech">
          ${project.tech.map(t => `<span class="tech-tag">${escapeHtml(t)}</span>`).join('')}
        </div>
        ${renderVideoSection(project)}
        <div class="project-btns">
          ${project.liveUrl ? `<a class="btn btn-primary" href="${escapeHtml(project.liveUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(uiLabels.live)}</a>` : ''}
          <a class="btn btn-secondary" href="${escapeHtml(project.githubUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(uiLabels.github)}</a>
        </div>
      </article>
    `).join('');

    document.getElementById('skills-list').innerHTML = skills.map(group => `
      <div class="skill-group">
        <p class="skill-category">${escapeHtml(group.category)}</p>
        <div class="skills-grid">
          ${group.skills.map(skill => `<span class="skill-tag">${escapeHtml(skill)}</span>`).join('')}
        </div>
      </div>
    `).join('');

    document.getElementById('site-footer').textContent = profile.footer;
  }

  function renderVideoSection(project) {
    const videoId = extractYouTubeId(project.demoVideo);
    if (!videoId) {
      return `<div class="video-wrap video-placeholder">${escapeHtml(uiLabels.noDemoVideo)}</div>`;
    }
    return `<div class="video-wrap" onclick="playVideo(this, '${videoId}')">
      <div class="video-thumb"><img src="https://img.youtube.com/vi/${videoId}/mqdefault.jpg" alt="${escapeHtml(project.title)} demo"/></div>
      <div class="video-play">${PLAY_ICON}</div>
    </div>`;
  }

  loadData()
    .then(renderPage)
    .catch(err => {
      console.error(err);
      document.getElementById('app').innerHTML = `
        <div class="loading-screen">
          <div class="loading-card">
            <div class="load-error">
              Could not load portfolio data.<br/><br/>
              Run locally with:<br/>
              <code>cd portfolio && python3 -m http.server 8080</code>
            </div>
          </div>
        </div>`;
    });
</script>
</body>
</html>
